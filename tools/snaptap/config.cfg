# -------------------------------------------------------------
# Settings (v1.8.0 — autodetect v4 + ban-risk awareness)
#
# autoDetect   1 = classify the foreground process against the built-in
#              game table (~150 titles), then suffix rules, then the
#              score heuristic (GPU + coverage% + borderless + store path).
#              Any game works, no per-game config. 0 = old whitelist mode
#              (activeOn list only). Default: 1
#
# requireFullscreen
#              Unknown titles only: 1 = unknown title needs coverage +
#              GPU to count. 0 = GPU alone is enough. Known titles skip
#              this check so windowed play still snaps. Default: 1
#
# coverPct     Unknown titles: monitor % area required (0-100).
#              Default 95 (was pixel-perfect 100% in v1.6.1 — DPI/DWM
#              shadows no longer break fullscreen detection). 0 = ignore
#              coverage, GPU alone decides. Lower to 80-85 if a borderless
#              game sits in a smaller window and never hits 95%.
#
# closeDebounceMs
#              Gate-close hysteresis. Opening is instant; closing waits
#              this long of consecutive non-game polls (default 400) so
#              alt-tab, overlay, and mode-switch flicker no longer dump
#              the pending queue or flap the log. 0 = close instantly.
#
# gfxRescanMs  How often a negative GPU-API scan retries (default 2000).
#              Fixes the v1.6.1 bug where a game that loaded D3D after
#              the first poll was stuck "not a game" forever. Positive
#              scans expire in 30s and rescan.
#
# minHoldMs    Physical key must be held this long before a snap can
#              trigger (default 12, was hardcoded). 0 = no debounce.
#
# activeOn     Whitelist mode only (autoDetect=0). Comma list of process
#              names, foreground-gated. Empty = always active.
#
# autoExclude  Extra process names to never classify as a game, comma list.
#              Wildcards ok: *helper.exe, *overlay.exe. Default: empty
#
# autoInclude  Extra process names to always classify as a game, comma list.
#              Wildcards ok. For a new title not in the table yet. Empty.
#
# jitterMinMs / jitterMaxMs
#              Whitelist-mode delay range. In autodetect the per-title tier
#              range below is used instead. Floor of 8 is the minimum that
#              keeps the release off the instant-snap signature.
#
# tierNoneMinMs/Max   no anti-cheat titles ......... default 6-14
# tierSoftMinMs/Max   VAC / light .................. default 8-18
# tierHardMinMs/Max   EAC / BattlEye ............... default 11-24
#                     ROB RUN (Steam 4262460, EAC via start_protected_game.exe)
#                     resolves here as "rob run.exe".
# tierKeenMinMs/Max   Vanguard / kernel ............ default 14-28
#
# settleMs     Extra dwell added before a sticky resume press, randomized
#              between settleMs/2 and settleMs. Default: 0
#
# idleUnhookMs Hook is removed after this long with no game focused, and
#              reinstalled the moment one is. 0 = stay hooked. Default: 3000
#
# skipChancePct
#              Percent chance a queued snap is dropped instead of fired.
#              A hand misses occasionally; a 100% fire rate is a pattern.
#              Default: 0 (set 1-2 if you want the wobble)
#
# banRiskLog  1 = write the policy note to logFile when a high/extreme-risk
#              title is detected (e.g. CS2's documented snap-tap ban, ROB
#              RUN's EAC client). Risk level always shows in tray/dialog.
#              Default: 1
#
# pollMs       Foreground poll interval. Default: 100
#
# toggleKey    Hotkey to enable/disable on the fly (ASCII, 0 = off).
# killKey      Hotkey to quit (0 = off).
# reloadKey    Hotkey to re-read this file without restarting (0 = off).
#              F8=119, F12=123.
#
# stealth      1 = no tray icon, no readable window/mutex names.
# tray         1 = system tray icon (default). Implied off when stealth=1.
# logFile      Optional event log (append, rotates at 256KB). Empty = off.
# -------------------------------------------------------------

autoDetect=1
requireFullscreen=1
coverPct=95
closeDebounceMs=400
gfxRescanMs=2000
minHoldMs=12
activeOn=
autoExclude=
autoInclude=

jitterMinMs=8
jitterMaxMs=18

tierNoneMinMs=6
tierNoneMaxMs=14
tierSoftMinMs=8
tierSoftMaxMs=18
tierHardMinMs=11
tierHardMaxMs=24
tierKeenMinMs=14
tierKeenMaxMs=28

settleMs=0
idleUnhookMs=3000
skipChancePct=0
banRiskLog=1
pollMs=100

toggleKey=0
killKey=0
reloadKey=0
stealth=0
tray=1
logFile=snaptap.log

# -------------------------------------------------------------
# Per-title overrides. Any [Game] block wins over the built-in table.
# Drop the block, restart/reload. exe is matched by file name, lowercase.
#
# [Game]
# exe=cs2.exe
# jitterMinMs=9
# jitterMaxMs=20
# settleMs=2
# tier=1
# -------------------------------------------------------------

