# -------------------------------------------------------------
# Settings (v1.5.0 â€” autodetect)
#
# autoDetect   1 = classify the foreground process against the built-in
#              game table, then against the generic fullscreen+GPU heuristic.
#              Any game works, no per-game config. 0 = old whitelist mode
#              (activeOn list only). Default: 1
#
# requireFullscreen
#              Unknown titles only: require the foreground window to cover the
#              monitor before it counts as a game. Known titles skip this
#              check so windowed play still snaps. Default: 1
#
# activeOn     Whitelist mode only (autoDetect=0). Comma list of process
#              names, foreground-gated. Empty = always active.
#
# autoExclude  Extra process names to never classify as a game, comma list.
#              Browsers, terminals, editors and capture tools are already
#              excluded in the binary. Default: empty
#
# jitterMinMs / jitterMaxMs
#              Whitelist-mode delay range. In autodetect the per-title tier
#              range below is used instead. Floor of 8 is the minimum that
#              keeps the release off the instant-snap signature.
#
# tierNoneMinMs/Max   no anti-cheat titles ......... default 6-14
# tierSoftMinMs/Max   VAC / light .................. default 8-18
# tierHardMinMs/Max   EAC / BattlEye ............... default 11-24
# tierKeenMinMs/Max   Vanguard / kernel ............ default 14-28
#
# settleMs     Extra dwell added before a sticky resume press, randomized
#              between settleMs/2 and settleMs. Default: 0
#
# idleUnhookMs Hook is removed after this long with no game focused, and
#              reinstalled the moment one is. 0 = stay hooked. Default: 3000
#
# skipChancePct
#              Percent chance a queued snap is dropped instead of fired.
#              A hand misses occasionally; a 100% fire rate is a pattern.
#              Default: 0 (set 1-2 if you want the wobble)
#
# pollMs       Foreground poll interval. Default: 100
#
# toggleKey    Hotkey to enable/disable on the fly (ASCII, 0 = off).
# killKey      Hotkey to quit (0 = off).
# reloadKey    Hotkey to re-read this file without restarting (0 = off).
#              F8=119, F12=123.
#
# stealth      1 = no tray icon, no readable window/mutex names.
# tray         1 = system tray icon (default). Implied off when stealth=1.
# logFile      Optional event log (append). Empty = off.
# -------------------------------------------------------------

autoDetect=1
requireFullscreen=1
activeOn=
autoExclude=

jitterMinMs=8
jitterMaxMs=18

tierNoneMinMs=6
tierNoneMaxMs=14
tierSoftMinMs=8
tierSoftMaxMs=18
tierHardMinMs=11
tierHardMaxMs=24
tierKeenMinMs=14
tierKeenMaxMs=28

settleMs=0
idleUnhookMs=3000
skipChancePct=0
pollMs=100

toggleKey=0
killKey=0
reloadKey=0
stealth=0
tray=1
logFile=snaptap.log

# -------------------------------------------------------------
# Per-title overrides. Any [Game] block wins over the built-in table.
# Drop the block, restart/reload. exe is matched by file name, lowercase.
#
# [Game]
# exe=cs2.exe
# jitterMinMs=9
# jitterMaxMs=20
# settleMs=2
# tier=1
# -------------------------------------------------------------

