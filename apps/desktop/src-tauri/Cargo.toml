[package]
name = "vytrix"
version = "0.1.0"
description = "YOUR DISPLAY. YOUR RULES. — Windows gaming display and performance suite"
authors = ["VYTRIX"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "vytrix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
doctest = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
parking_lot = "0.12"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
tiny_http = "0.12"
rand = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
