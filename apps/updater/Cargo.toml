[package]
name = "vytrix-updater"
version = "0.1.1"
description = "Signed, offline-tolerant updater for VYTRIX"
edition = "2021"
rust-version = "1.77"
publish = false

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "2"
sha2 = "0.10"
hex = "0.4"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
